name: CI and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "scripts/workflow-policy.test.ts"
      - "tests/postdeploy/post-deploy.spec.ts"
  pull_request:

permissions:
  contents: read

concurrency:
  group: shouting-chickens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      artifact_manifest_sha: ${{ steps.artifact.outputs.sha256 }}
      commit_sha: ${{ github.sha }}

    env:
      PAGES_BASE_PATH: /shouting-chickens/

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm run test

      - name: Record release identity
        id: metadata
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and seal production artifact
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run sealed Pages acceptance tests
        run: npm run test:e2e:production

      - name: Record sealed artifact digest
        id: artifact
        shell: bash
        run: |
          ARTIFACT_SHA="$(sha256sum dist/artifact-manifest.json | cut -d ' ' -f 1)"
          echo "sha256=$ARTIFACT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload tested release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mvp-${{ steps.metadata.outputs.app_version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Upload tested Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy tested artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy tested Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  postdeploy:
    name: Verify deployed game
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out deployed source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.quality.outputs.commit_sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed artifact
        env:
          APP_VERSION: ${{ needs.quality.outputs.app_version }}
          ARTIFACT_MANIFEST_SHA: ${{ needs.quality.outputs.artifact_manifest_sha }}
          COMMIT_SHA: ${{ needs.quality.outputs.commit_sha }}
          DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:postdeploy

      - name: Upload post-deploy failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postdeploy-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
