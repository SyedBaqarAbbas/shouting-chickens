<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="80" viewBox="0 0 1280 80">
  <title>Original Shouting Chickens vector game atlas</title>
  <desc>Sixteen hand-authored frames for the bird, course, interface, and effects.</desc>
  <defs>
    <style>
      .ink{stroke:#10233b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .cream{fill:#e2e8f0}.gold{fill:#ffcc00}.coral{fill:#ff3b30}.teal{fill:#41c7a4}
      .sky{fill:#3b82f6}.navy{fill:#10233b}.white{fill:#ffffff}.grey{fill:#cbd5e1}
    </style>
  </defs>

  <!-- chicken idle -->
  <g transform="translate(0)">
    <path class="coral ink" d="M33 16c-3-6 4-9 8-4 3-6 9-4 7 4z"/>
    <path class="white ink" d="M26 36c0-12 28-12 28 0v18c0 8-28 8-28 0z"/>
    <path class="grey ink" d="M26 38c0-8 12-8 12 6c0 8-12 8-12-2z"/>
    <circle class="navy" cx="47" cy="32" r="3"/>
    <circle class="white" cx="48" cy="31" r="1"/>
    <path class="gold ink" d="m54 32 13 4-13 5z"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M34 60v12m14-12v12"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M29 72h10m4 0h10"/>
  </g>

  <!-- chicken run A -->
  <g transform="translate(80)">
    <path class="coral ink" d="M33 16c-3-6 4-9 8-4 3-6 9-4 7 4z"/>
    <path class="white ink" d="M26 36c0-12 28-12 28 0v18c0 8-28 8-28 0z" transform="rotate(4 40 45)"/>
    <path class="grey ink" d="M26 38c0-8 12-8 12 6c0 8-12 8-12-2z"/>
    <circle class="navy" cx="47" cy="32" r="3"/>
    <circle class="white" cx="48" cy="31" r="1"/>
    <path class="gold ink" d="m54 32 13 4-13 5z"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="m32 58-6 13m18-13 8 10"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M20 71h11m12 0h10"/>
  </g>

  <!-- chicken run B -->
  <g transform="translate(160)">
    <path class="coral ink" d="M33 16c-3-6 4-9 8-4 3-6 9-4 7 4z"/>
    <path class="white ink" d="M26 36c0-12 28-12 28 0v18c0 8-28 8-28 0z" transform="rotate(-4 40 45)"/>
    <path class="grey ink" d="M26 38c0-8 12-8 12 6c0 8-12 8-12-2z"/>
    <circle class="navy" cx="47" cy="32" r="3"/>
    <circle class="white" cx="48" cy="31" r="1"/>
    <path class="gold ink" d="m54 32 13 4-13 5z"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="m35 58 7 12m7-12-6 12"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M36 71h10m1 0h10"/>
  </g>

  <!-- chicken jump -->
  <g transform="translate(240)">
    <path class="coral ink" d="M33 12c-3-6 4-9 8-4 3-6 9-4 7 4z"/>
    <path class="white ink" d="M26 32c0-12 28-12 28 0v18c0 8-28 8-28 0z"/>
    <path class="grey ink" d="M26 34c0-8 12-8 12 6c0 8-12 8-12-2z"/>
    <circle class="navy" cx="47" cy="28" r="3"/>
    <circle class="white" cx="48" cy="27" r="1"/>
    <path class="gold ink" d="m54 28 13 4-13 5z"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="m32 54-5 8 8 2m15-10 5 8-8 2"/>
  </g>

  <!-- chicken flap A -->
  <g transform="translate(320)">
    <path class="coral ink" d="M33 16c-3-6 4-9 8-4 3-6 9-4 7 4z"/>
    <path class="white ink" d="M26 36c0-12 28-12 28 0v18c0 8-28 8-28 0z"/>
    <path class="grey ink" d="M26 34c-12-6-16-16-8-20 8 10 16 14 20 16z"/>
    <circle class="navy" cx="47" cy="32" r="3"/>
    <circle class="white" cx="48" cy="31" r="1"/>
    <path class="gold ink" d="m54 32 13 4-13 5z"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M34 60v12m14-12v12"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M29 72h10m4 0h10"/>
  </g>

  <!-- chicken flap B -->
  <g transform="translate(400)">
    <path class="coral ink" d="M33 16c-3-6 4-9 8-4 3-6 9-4 7 4z"/>
    <path class="white ink" d="M26 36c0-12 28-12 28 0v18c0 8-28 8-28 0z"/>
    <path class="grey ink" d="M26 38c-12 6-16 16-8 20 8-10 16-14 20-16z"/>
    <circle class="navy" cx="47" cy="32" r="3"/>
    <circle class="white" cx="48" cy="31" r="1"/>
    <path class="gold ink" d="m54 32 13 4-13 5z"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M34 60v12m14-12v12"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="M29 72h10m4 0h10"/>
  </g>

  <!-- chicken death -->
  <g transform="translate(480)">
    <path class="coral ink" d="M33 16c-3-6 4-9 8-4 3-6 9-4 7 4z"/>
    <path class="white ink" d="M26 36c0-12 28-12 28 0v18c0 8-28 8-28 0z" transform="rotate(30 40 45)"/>
    <path class="grey ink" d="M26 38c0-8 12-8 12 6c0 8-12 8-12-2z"/>
    <path class="ink" fill="none" d="m44 30 6 6m0-6-6 6"/>
    <path class="gold ink" d="m54 34 13 4-13 5z"/>
    <path class="ink" fill="none" stroke="#ffcc00" stroke-width="4" d="m20 60-8 6m36-4 10 4"/>
  </g>

  <!-- feather -->
  <g transform="translate(560)">
    <path class="cream ink" d="M17 58C23 22 49 8 68 14c-1 26-19 48-48 49z"/>
    <path class="teal ink" d="M27 50c8-16 20-25 35-31-7 14-18 25-35 31z"/>
    <path class="ink" fill="none" d="M13 71c14-21 29-36 49-51M31 46l-11-5m20-6-8-8m18 0-4-9"/>
    <path class="gold" d="m60 56 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>

  <!-- spike -->
  <g transform="translate(640)">
    <path class="navy ink" d="M7 68 21 25l11 25 12-40 13 39 10-25 8 44z"/>
    <path class="white" d="m21 50 3-10 4 10zm23-18 3-10 4 12zm13 22 3-12 4 12z"/>
    <path class="coral ink" d="M7 68h68v8H7z"/>
  </g>

  <!-- moving hazard -->
  <g transform="translate(720)">
    <path class="coral ink" d="m8 64 8-39 12 20 12-34 12 34 12-20 8 39z"/>
    <circle class="white ink" cx="32" cy="51" r="7"/>
    <circle class="white ink" cx="51" cy="51" r="7"/>
    <circle class="navy" cx="34" cy="52" r="3"/>
    <circle class="navy" cx="49" cy="52" r="3"/>
    <path class="navy ink" d="M11 64h61v10H11z"/>
    <path class="sky ink" fill="none" d="M8 15H1m75 0h-7M8 7 3 2m73 5 5-5"/>
  </g>

  <!-- microphone -->
  <g transform="translate(800)">
    <rect class="white ink" x="27" y="9" width="26" height="43" rx="13"/>
    <path class="navy" d="M34 19h12v4H34zm0 9h12v4H34z"/>
    <path class="ink" fill="none" stroke="#ffffff" stroke-width="4" d="M19 36c0 24 42 24 42 0M40 60v12M27 72h26"/>
  </g>

  <!-- warning -->
  <g transform="translate(880)">
    <path class="gold ink" d="M40 7 75 70H5z"/>
    <path class="navy" d="M36 27h8l-2 24h-4zm0 31h8v8h-8z"/>
    <path class="coral ink" d="M7 70h66"/>
  </g>

  <!-- grass tile -->
  <g transform="translate(960)">
    <path class="teal" d="M0 20h80v60H0z"/>
    <path class="gold" d="m0 24 8-10 7 10 9-17 8 17 9-12 8 12 9-18 8 18 8-11 7 11v56H0z"/>
    <path class="ink" fill="none" d="M0 25h80"/>
    <path fill="#fff4ce" opacity=".42" d="M8 38h18v5H8zm40 13h22v5H48z"/>
  </g>

  <!-- platform tile -->
  <g transform="translate(1040)">
    <path fill="#a95c38" d="M0 0h80v80H0z"/>
    <path class="ink" fill="none" d="M0 15h80M0 48h80M22 0v15m37 0v33M34 48v32"/>
    <path fill="#d9874d" d="M7 24h28v8H7zm42 33h24v8H49z"/>
    <path fill="#10233b" opacity=".28" d="M0 70h80v10H0z"/>
  </g>

  <!-- water tile -->
  <g transform="translate(1120)">
    <path fill="#0b54be" d="M0 24h80v56H0z"/>
    <path fill="#3b82f6" d="M0 12c10-10 20-10 30 0s20 10 30 0 20-10 20-10v68H0z"/>
    <path class="white" d="M0 12c10-10 20-10 30 0s20 10 30 0 20-10 20-10v8c-10-10-20-10-30 0s-20 10-30 0S10 10 0 10z"/>
  </g>

  <!-- spark -->
  <g transform="translate(1200)">
    <path class="gold ink" d="m40 4 8 24 24-8-17 20 17 20-24-8-8 24-8-24-24 8 17-20L8 20l24 8z"/>
    <circle class="white" cx="40" cy="40" r="8"/>
    <circle class="coral" cx="40" cy="40" r="4"/>
  </g>
</svg>
