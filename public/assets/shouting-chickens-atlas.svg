<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="80" viewBox="0 0 1280 80">
  <title>Original Shouting Chickens vector game atlas</title>
  <desc>Sixteen hand-authored frames for the bird, course, interface, and effects matching reference atlas screenshot.</desc>
  <defs>
    <style>
      .ink{stroke:#10233b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .white{fill:#ffffff}.navy{fill:#10233b}.red{fill:#ff2d2d}.gold{fill:#ffc107}
      .grey{fill:#e2e4f0}.cyan{fill:#06b6d4}.brick{fill:#78350f}.blue{fill:#2563eb}
    </style>
  </defs>

  <!-- 0: chicken-idle -->
  <g transform="translate(0)">
    <path class="red" d="M36 12c-3-6 3-10 7-5 3-5 9-3 7 5z"/>
    <path class="grey" d="M22 36c-8 6-10 18-4 26 6 6 16 4 20-4z"/>
    <path class="white ink" d="M26 32c0-12 26-12 26 0v22c0 8-26 8-26 0z"/>
    <path class="grey ink" stroke-width="2" d="M26 36c0-6 10-6 10 4c0 6-10 6-10-4z"/>
    <circle class="navy" cx="47" cy="30" r="3"/>
    <path class="gold ink" stroke-width="2" d="m52 30 14 4-14 5z"/>
    <path fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" d="M34 54v18m12-18v18M30 72h8m8 0h8"/>
  </g>

  <!-- 1: chicken-run-a -->
  <g transform="translate(80)">
    <path class="red" d="M36 12c-3-6 3-10 7-5 3-5 9-3 7 5z"/>
    <path class="grey" d="M22 36c-8 6-10 18-4 26 6 6 16 4 20-4z"/>
    <path class="white ink" d="M26 32c0-12 26-12 26 0v22c0 8-26 8-26 0z"/>
    <path class="grey ink" stroke-width="2" d="M26 36c0-6 10-6 10 4c0 6-10 6-10-4z"/>
    <circle class="navy" cx="47" cy="30" r="3"/>
    <path class="gold ink" stroke-width="2" d="m52 30 14 4-14 5z"/>
    <path fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" d="m32 54-8 16m20-16 10 12M20 70h8m18 0h8"/>
  </g>

  <!-- 2: chicken-run-b -->
  <g transform="translate(160)">
    <path class="red" d="M36 12c-3-6 3-10 7-5 3-5 9-3 7 5z"/>
    <path class="grey" d="M22 36c-8 6-10 18-4 26 6 6 16 4 20-4z"/>
    <path class="white ink" d="M26 32c0-12 26-12 26 0v22c0 8-26 8-26 0z"/>
    <path class="grey ink" stroke-width="2" d="M26 36c0-6 10-6 10 4c0 6-10 6-10-4z"/>
    <circle class="navy" cx="47" cy="30" r="3"/>
    <path class="gold ink" stroke-width="2" d="m52 30 14 4-14 5z"/>
    <path fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" d="m34 54 8 16m10-16-10 16M38 70h8m-18 0h8"/>
  </g>

  <!-- 3: chicken-jump -->
  <g transform="translate(240)">
    <path class="red" d="M36 12c-3-6 3-10 7-5 3-5 9-3 7 5z"/>
    <path class="grey" d="M22 36c-8 6-10 18-4 26 6 6 16 4 20-4z"/>
    <path class="white ink" d="M26 32c0-12 26-12 26 0v22c0 8-26 8-26 0z"/>
    <path class="grey ink" stroke-width="2" d="M26 34c-12-8-14-22-4-26 8 8 12 18 16 22z"/>
    <circle class="navy" cx="47" cy="30" r="3"/>
    <path class="gold ink" stroke-width="2" d="m52 30 14 4-14 5z"/>
    <path fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" d="M34 54v16m12-16v16M30 70h8m8 0h8"/>
  </g>

  <!-- 4: chicken-flap-a -->
  <g transform="translate(320)">
    <g transform="rotate(35 40 45)">
      <path class="red" d="M36 12c-3-6 3-10 7-5 3-5 9-3 7 5z"/>
      <path class="white ink" d="M26 32c0-12 26-12 26 0v22c0 8-26 8-26 0z"/>
      <path class="grey ink" stroke-width="2" d="M26 34c-12-8-14-22-4-26 8 8 12 18 16 22z"/>
      <path stroke="#10233b" stroke-width="3" stroke-linecap="round" d="m44 27 6 6m0-6-6 6"/>
      <path class="gold ink" stroke-width="2" d="m52 30 14 4-14 5z"/>
      <path fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" d="m30 54-8 12m16-12 6 10"/>
    </g>
  </g>

  <!-- 5: chicken-flap-b -->
  <g transform="translate(400)">
    <g transform="rotate(85 40 45)">
      <path class="red" d="M36 12c-3-6 3-10 7-5 3-5 9-3 7 5z"/>
      <path class="white ink" d="M26 32c0-12 26-12 26 0v22c0 8-26 8-26 0z"/>
      <path class="grey ink" stroke-width="2" d="M26 36c0-6 10-6 10 4c0 6-10 6-10-4z"/>
      <path stroke="#10233b" stroke-width="3" stroke-linecap="round" d="m44 27 6 6m0-6-6 6"/>
      <path class="gold ink" stroke-width="2" d="m52 30 14 4-14 5z"/>
      <path fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" d="M34 54v14m12-14v14"/>
    </g>
  </g>

  <!-- 6: chicken-death -->
  <g transform="translate(480)">
    <g transform="rotate(85 40 45)">
      <path class="red" d="M36 12c-3-6 3-10 7-5 3-5 9-3 7 5z"/>
      <path class="white ink" d="M26 32c0-12 26-12 26 0v22c0 8-26 8-26 0z"/>
      <path class="grey ink" stroke-width="2" d="M26 36c0-6 10-6 10 4c0 6-10 6-10-4z"/>
      <path stroke="#10233b" stroke-width="3" stroke-linecap="round" d="m44 27 6 6m0-6-6 6"/>
      <path class="gold ink" stroke-width="2" d="m52 30 14 4-14 5z"/>
      <path fill="none" stroke="#ffc107" stroke-width="4" stroke-linecap="round" d="M34 54v14m12-14v14"/>
    </g>
  </g>

  <!-- 7: feather -->
  <g transform="translate(560)">
    <path fill="#e5e7eb" stroke="#10233b" stroke-width="3" stroke-linejoin="round" d="M22 62C25 24 55 10 72 14c-4 28-26 50-50 48z"/>
    <path fill="#0f766e" stroke="#10233b" stroke-width="2" d="M32 53c8-18 20-28 35-33-8 15-20 27-35 33z"/>
    <path stroke="#10233b" stroke-width="3" stroke-linecap="round" fill="none" d="M16 68c16-22 32-38 52-52M34 46l-10-4m20-7-8-7m18 0-4-8"/>
    <path class="gold" d="m66 54 3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
  </g>

  <!-- 8: spike -->
  <g transform="translate(640)">
    <path fill="#6b7280" stroke="#10233b" stroke-width="3" stroke-linejoin="round" d="M6 72 32 14l20 32 12-22 14 48z"/>
    <path fill="#9ca3af" d="m32 14-8 16h16zm20 32-6 10h12zm12-22-5 9h10z"/>
  </g>

  <!-- 9: moving-hazard -->
  <g transform="translate(720)">
    <path class="red" stroke="#10233b" stroke-width="3" stroke-linejoin="round" d="M8 72 20 28l12 24 16-44 14 36 12-20 4 48z"/>
  </g>

  <!-- 10: microphone -->
  <g transform="translate(800)">
    <rect fill="#1e293b" x="28" y="10" width="24" height="42" rx="12"/>
    <path class="white" d="M34 20h12v4H34zm0 10h12v4H34z"/>
    <path fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" d="M20 36c0 24 40 24 40 0M40 58v16M28 74h24"/>
  </g>

  <!-- 11: warning -->
  <g transform="translate(880)">
    <path class="gold" stroke="#10233b" stroke-width="3" stroke-linejoin="round" d="M40 8 74 70H6z"/>
    <path class="navy" d="M36 28h8l-2 22h-4zm0 28h8v8h-8z"/>
  </g>

  <!-- 12: grass -->
  <g transform="translate(960)">
    <path class="gold" d="M0 20h80v60H0z"/>
    <path fill="#06b6d4" d="m0 20 8-16 8 16 8-16 8 16 8-16 8 16 8-16 8 16 8-16 8 16v60H0z"/>
    <path fill="none" stroke="#10233b" stroke-width="3" d="M0 20h80"/>
  </g>

  <!-- 13: platform -->
  <g transform="translate(1040)">
    <rect class="brick" x="0" y="0" width="80" height="80"/>
    <path fill="none" stroke="#451a03" stroke-width="3" d="M0 26h80M0 54h80M26 0v26m28 26v28M40 26v28"/>
    <path fill="#b45309" d="M6 32h24v12H6zm44 6h22v12H50z"/>
  </g>

  <!-- 14: water -->
  <g transform="translate(1120)">
    <path class="blue" d="M0 16c10-10 20-10 30 0s20 10 30 0 20-10 20-10v74H0z"/>
  </g>

  <!-- 15: spark -->
  <g transform="translate(1200)">
    <path class="gold" stroke="#10233b" stroke-width="2" d="m40 4 9 24 25-9-16 19 21 16-26 3 3 26-21-16-16 21 3-26-26-3 21-16-16-19 25 9z"/>
    <circle class="red" cx="40" cy="40" r="10"/>
  </g>
</svg>
