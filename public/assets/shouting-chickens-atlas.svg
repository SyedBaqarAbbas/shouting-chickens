<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 80" width="1280" height="80">
  <title>Original Shouting Chickens vector game atlas</title>
  <desc>Sixteen hand-authored frames for the bird, course, interface, and effects.</desc>
  <defs>
    <style>
      .body { fill: #ffffff; }
      .accent { fill: #e5e5eb; }
      .comb { fill: #f93822; }
      .beak-legs { fill: #f5b915; }
      .eye { fill: #111111; }
      .dark { fill: #333333; }
      .mountain { fill: #888888; }
      .mountain-light { fill: #aaaaaa; }
      .grass { fill: #4CAF50; }
      .dirt { fill: #a0522d; }
      .brick { fill: #8b4513; }
      .water-light { fill: #3b82f6; }
      .water-dark { fill: #1d4ed8; }
    </style>

    <!-- Standard Leg Reusable Component -->
    <g id="leg">
      <rect x="-3" y="0" width="6" height="15" class="beak-legs" />
      <rect x="-3" y="11" width="12" height="4" class="beak-legs" />
    </g>

    <!-- Core Chicken Base -->
    <g id="core_chicken">
      <rect x="15" y="18" width="48" height="52" rx="18" class="body" />
      <path class="comb" d="M 28 20 C 24 6 40 4 44 18 Z" />
      <polygon points="62,34 80,40 62,46" class="beak-legs" />
      <circle cx="52" cy="34" r="5" class="eye" />
      <path class="accent" d="M 15 58 C 2 58 -2 38 8 36 C 8 50 12 53 15 53 Z" />
    </g>

    <!-- Wing Variations -->
    <path id="wing_down" class="accent" d="M 20 42 C 38 42 38 60 20 60 Z" />
    <path id="wing_up" class="accent" d="M 25 45 C 25 28 10 16 10 32 Z" />
  </defs>

  <!-- 0: chicken-idle (Standing) -->
  <g transform="translate(0)">
    <use href="#core_chicken" />
    <use href="#leg" x="28" y="68" />
    <use href="#leg" x="48" y="68" />
    <use href="#wing_down" />
  </g>

  <!-- 1: chicken-run-a (Walking 1) -->
  <g transform="translate(80)">
    <use href="#core_chicken" />
    <use href="#leg" x="28" y="68" transform="rotate(20 28 68)" />
    <use href="#leg" x="48" y="68" transform="rotate(-20 48 68)" />
    <use href="#wing_down" />
  </g>

  <!-- 2: chicken-run-b (Walking 2) -->
  <g transform="translate(160)">
    <use href="#core_chicken" />
    <use href="#leg" x="38" y="68" />
    <use href="#leg" x="48" y="63" transform="rotate(-45 48 63)" />
    <use href="#wing_down" />
  </g>

  <!-- 3: chicken-jump (Running) -->
  <g transform="translate(240)">
    <use href="#core_chicken" />
    <use href="#leg" x="24" y="68" transform="rotate(40 24 68)" />
    <use href="#leg" x="52" y="68" transform="rotate(-30 52 68)" />
    <path class="accent" d="M 32 50 C 12 50 2 35 17 40 Z" />
  </g>

  <!-- 4: chicken-flap-a (Flapping) -->
  <g transform="translate(320)">
    <use href="#core_chicken" />
    <use href="#leg" x="32" y="68" transform="rotate(20 32 68)" />
    <use href="#leg" x="44" y="68" transform="rotate(-20 44 68)" />
    <use href="#wing_up" />
  </g>

  <!-- 5: chicken-flap-b (Flapping Alt) -->
  <g transform="translate(400)">
    <use href="#core_chicken" />
    <use href="#leg" x="28" y="68" transform="rotate(-15 28 68)" />
    <use href="#leg" x="48" y="68" transform="rotate(25 48 68)" />
    <use href="#wing_up" />
  </g>

  <!-- 6: chicken-death (Dead / Squished) -->
  <g transform="translate(480)">
    <g transform="translate(40, 48) rotate(-90) translate(-40, -40)">
      <use href="#core_chicken" />
      <use href="#leg" x="28" y="68" />
      <use href="#leg" x="48" y="68" />
      <use href="#wing_down" />
      <circle cx="52" cy="34" r="6" class="body" />
      <path d="M 47 29 L 57 39 M 57 29 L 47 39" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 7: feather -->
  <g transform="translate(560)">
    <path d="M 15 72 Q 0 40 32 10 Q 64 10 70 15 Q 70 48 38 78 Z" class="accent" />
    <path d="M 10 78 L 65 20" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
    <path d="M 32 54 L 42 64 M 42 42 L 58 54 M 26 38 L 38 48" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <polygon points="68,58 71,66 79,69 71,72 68,80 65,72 57,69 65,66" class="beak-legs" />
  </g>

  <!-- 8: spike (Mountains) -->
  <g transform="translate(640)">
    <polygon points="0,80 32,10 64,80" class="mountain"/>
    <polygon points="38,80 60,28 80,80" class="mountain-light"/>
    <polygon points="32,10 22,34 42,34" class="body"/>
    <polygon points="60,28 50,48 70,48" class="body"/>
    <rect x="0" y="74" width="80" height="6" class="mountain"/>
  </g>

  <!-- 9: moving-hazard (Fire / Spikes) -->
  <g transform="translate(720)">
    <polygon points="0,80 16,20 30,56 44,8 58,60 72,24 80,80" class="comb"/>
    <rect x="0" y="74" width="80" height="6" class="comb"/>
  </g>

  <!-- 10: microphone -->
  <g transform="translate(800)">
    <rect x="28" y="10" width="24" height="42" rx="12" class="dark"/>
    <line x1="30" y1="22" x2="50" y2="22" stroke="#ffffff" stroke-width="3"/>
    <line x1="30" y1="34" x2="50" y2="34" stroke="#ffffff" stroke-width="3"/>
    <path d="M 18 34 A 22 22 0 0 0 62 34" fill="none" stroke="#333333" stroke-width="4"/>
    <rect x="38" y="56" width="4" height="18" class="dark"/>
    <rect x="24" y="74" width="32" height="4" rx="2" class="dark"/>
  </g>

  <!-- 11: warning -->
  <g transform="translate(880)">
    <polygon points="40,6 76,74 4,74" class="beak-legs"/>
    <rect x="36" y="28" width="8" height="24" class="dark" rx="2"/>
    <circle cx="40" cy="62" r="4.5" class="dark"/>
  </g>

  <!-- 12: grass -->
  <g transform="translate(960)">
    <rect x="0" y="32" width="80" height="48" class="beak-legs"/>
    <polygon points="0,32 10,16 20,32 30,16 40,32 50,16 60,32 70,16 80,32" class="grass"/>
    <rect x="12" y="48" width="20" height="6" fill="#eab308"/>
    <rect x="48" y="64" width="20" height="6" fill="#eab308"/>
  </g>

  <!-- 13: platform -->
  <g transform="translate(1040)">
    <rect x="0" y="0" width="80" height="80" class="dirt"/>
    <line x1="0" y1="26" x2="80" y2="26" stroke="#70351b" stroke-width="4"/>
    <line x1="0" y1="54" x2="80" y2="54" stroke="#70351b" stroke-width="4"/>
    <line x1="40" y1="0" x2="40" y2="26" stroke="#70351b" stroke-width="4"/>
    <line x1="20" y1="26" x2="20" y2="54" stroke="#70351b" stroke-width="4"/>
    <line x1="60" y1="26" x2="60" y2="54" stroke="#70351b" stroke-width="4"/>
    <line x1="40" y1="54" x2="40" y2="80" stroke="#70351b" stroke-width="4"/>
  </g>

  <!-- 14: water -->
  <g transform="translate(1120)">
    <rect x="0" y="16" width="80" height="64" class="water-dark"/>
    <path d="M 0 16 Q 10 4 20 16 T 40 16 T 60 16 T 80 16 L 80 80 L 0 80 Z" class="water-light"/>
    <path d="M 0 16 Q 10 4 20 16 T 40 16 T 60 16 T 80 16 L 80 24 Q 70 12 60 24 T 40 24 T 20 24 T 0 24 Z" class="body"/>
  </g>

  <!-- 15: spark -->
  <g transform="translate(1200)">
    <polygon points="40,4 48,28 74,28 53,44 61,70 40,54 19,70 27,44 6,28 32,28" class="beak-legs"/>
    <circle cx="40" cy="40" r="9" class="comb"/>
  </g>
</svg>
